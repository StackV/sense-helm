{{- $mysqlName := printf "%s-mysql" (include "common.name" .) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ include "common.namespace" . | quote }}
  labels: {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
  name: {{ $mysqlName }}
spec:
  selector:
    matchLabels: {{ include "common.labels.match" . | nindent 6 }}
      app.kubernetes.io/component: mysql
  serviceName: {{ $mysqlName }}
  replicas: 1
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/mysql-config-map.yaml") . | sha256sum }}
      labels: {{- include "common.labels" . | nindent 8 }}
        app.kubernetes.io/component: mysql
      name: {{ $mysqlName }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.mysql.terminationGracePeriodSeconds }}
      containers:
        - env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.credSecret }}
                  key: {{ .Values.mysql.passwordKey }}
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          {{- if .Values.mysql.probes.startup.custom }}
          startupProbe: {{- include "common.render" (dict "value" .Values.mysql.probes.startup.custom "context" $) | nindent 12 }}
          {{- else if .Values.mysql.probes.startup.enabled }}
          startupProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin -uroot ping --silent'
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          {{- end }}
          {{- if .Values.mysql.probes.liveness.custom }}
          livenessProbe: {{- include "common.render" (dict "value" .Values.mysql.probes.liveness.custom "context" $) | nindent 12 }}
          {{- else if .Values.mysql.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin -uroot ping --silent'
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          {{- end }}
          {{- if .Values.mysql.probes.readiness.custom }}
          readinessProbe: {{- include "common.render" (dict "value" .Values.mysql.probes.readiness.custom "context" $) | nindent 12 }}
          {{- else if .Values.mysql.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -uroot -e "SELECT 1"'
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          {{- end }}
          name: {{ $mysqlName }}
          ports:
            - containerPort: 3306
              protocol: TCP
          {{- with .Values.mysql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-data
            - mountPath: /docker-entrypoint-initdb.d/
              name: mysql-init
            - mountPath: /etc/mysql/conf.d/
              name: mysql-config
      restartPolicy: Always
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-mysql-pvc" (include "common.name" .)) .Values.mysql.pvcName }}
        - configMap:
            name: {{ printf "%s-mysql-config" (include "common.name" .) }}
          name: mysql-config
        - configMap:
            name: {{ printf "%s-mysql-init" (include "common.name" .) }}
          name: mysql-init
      {{- if .Values.mysql.affinity }}
      affinity: {{- include "common.render" ( dict "value" .Values.mysql.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.mysql.nodeSelector }}
      nodeSelector: {{- include "common.render" ( dict "value" .Values.mysql.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.mysql.tolerations }}
      tolerations: {{- include "common.render" (dict "value" .Values.mysql.tolerations "context" .) | nindent 8 }}
      {{- end }}